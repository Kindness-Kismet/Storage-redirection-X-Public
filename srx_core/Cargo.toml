[package]
name = "srx_core"
version = "1.2.59"
edition = "2024"

[lib]
name = "srx_core"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2.191"
jni-sys = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
once_cell = "1.21.4"
srx_hook = { git = "https://github.com/Kindness-Kismet/srx_hook.git", branch = "main" }
srx_inline_hook = { path = "third_party/srx_inline_hook" }
log = "0.4.34"
